[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<1.0",
    "openai>=1.0,<3",
    "paper-qa[local]>=2026.8.12",
    "pydantic>=2,<3",
    "PyMuPDF>=1.26,<1.27",
    "python-multipart>=0.0.9,<1.0",
    "SQLAlchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "uvicorn>=0.30,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
